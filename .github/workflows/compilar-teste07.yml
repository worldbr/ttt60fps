name: TTT FPS - Teste 07 Diagnostico
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'Makefile'
      - 'exports.exp'
      - 'TTT_FPS_TEST07/**'
      - '.github/workflows/compilar-teste07.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: pspdev/pspdev:v20261001
    steps:
      - uses: actions/checkout@v4
      - name: Compilar PRX
        shell: bash
        run: |
          set -eux
          export PSPDEV=/usr/local/pspdev
          export PATH="$PSPDEV/bin:$PATH"
          psp-gcc --version
          make clean || true
          make
          test -s ttt_fps_teste07.prx
          mkdir -p dist/TTT_FPS_TEST07
          cp ttt_fps_teste07.prx dist/TTT_FPS_TEST07/
          cp TTT_FPS_TEST07/plugin.ini dist/TTT_FPS_TEST07/
          cp README_PTBR.md dist/
      - uses: actions/upload-artifact@v4
        with:
          name: TTT-FPS-Teste07-Diagnostico
          path: dist/
