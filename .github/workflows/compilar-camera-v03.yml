name: TTT Camera Distance V03 (experimental)
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'Makefile'
      - 'exports.exp'
      - 'TTT_CAMERA_DIST03/**'
      - 'tests/**'
      - '.github/workflows/compilar-camera-v03.yml'
jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: pspdev/pspdev:v20261001
    steps:
      - uses: actions/checkout@v4
      - name: Verificar enderecos de referencia
        shell: bash
        run: |
          set -eux
          python3 tests/verificar_elf.py
      - name: Compilar PRX
        shell: bash
        run: |
          set -eux
          export PSPDEV=/usr/local/pspdev
          export PATH="$PSPDEV/bin:$PATH"
          psp-gcc --version
          make clean || true
          make
          test -s ttt_camera_dist03.prx
          mkdir -p dist/TTT_CAMERA_DIST03
          cp ttt_camera_dist03.prx dist/TTT_CAMERA_DIST03/
          cp TTT_CAMERA_DIST03/plugin.ini dist/TTT_CAMERA_DIST03/
          cp README_PTBR.md dist/
      - uses: actions/upload-artifact@v4
        with:
          name: TTT-Camera-Distance-V03-Experimental
          path: dist/
