name: TTT Camera FOV V06 (matrizes A/B)
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'Makefile'
      - 'exports.exp'
      - 'TTT_CAMERA_FOV06/**'
      - 'tests/verificar_pacote.sh'
      - '.github/workflows/compilar-camera-fov06.yml'
jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: pspdev/pspdev:v20261001
    steps:
      - uses: actions/checkout@v4
      - name: Validar plugin.ini
        shell: sh
        run: sh tests/verificar_pacote.sh
      - name: Compilar e empacotar PRX
        shell: bash
        run: |
          set -eux
          export PSPDEV=/usr/local/pspdev
          export PATH="$PSPDEV/bin:$PATH"
          psp-gcc --version
          make clean || true
          make
          sh tests/verificar_pacote.sh --check-prx
          mkdir -p dist/TTT_CAMERA_FOV06
          cp ttt_camera_fov06.prx dist/TTT_CAMERA_FOV06/
          cp TTT_CAMERA_FOV06/plugin.ini dist/TTT_CAMERA_FOV06/
          cp README_PTBR.md dist/
          test -s dist/TTT_CAMERA_FOV06/ttt_camera_fov06.prx
          grep -Fx 'filename = ttt_camera_fov06.prx' dist/TTT_CAMERA_FOV06/plugin.ini
      - name: Disponibilizar plugin pronto
        uses: actions/upload-artifact@v4
        with:
          name: TTT-Camera-FOV-V06-Experimental
          path: dist/
